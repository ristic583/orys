<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI PM — Variant E (current + A)</title>
<!--
  E = the current web app's look (web/src/styles.css) + A's structure.
  Kept from current: black background, Geist / Geist Mono, violet + lime accents, white pill nav, chips,
    26px cards, big percentage numbers, phase-track circles, graph nodes, blurred drawer, wizard rail.
  Taken from A: "Needs you" first, a 7-stop stage line + task ticks on every project card,
    sentence headline, all phases visible as lanes (graph by dependency depth) joined by
    "merged into main", the agent flow above the plan, "What to fix" up front in the drawer.
  Usage stats move below the projects (full detail stays on the Usage page).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* tokens copied from web/src/styles.css */
:root{color-scheme:dark;--bg:#000;--surface:#121212;--surface-2:#1a1a1a;--surface-3:#232323;--text:#f4f4f5;--muted:#8a8a8f;--muted-strong:#9d9da3;
  --violet:#7a4dff;--violet-2:#a387ff;--violet-3:#4b2fa8;--violet-soft:rgba(122,77,255,.16);--lime:#d4f26a;--cyan:#45c6f0;--amber:#f5b84a;--red:#ff6b6b;
  --sans:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,monospace;--r-card:26px;--r-pill:999px}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--violet-2);outline-offset:2px}
h1{font-size:clamp(28px,4vw,46px);font-weight:500;letter-spacing:-.035em;line-height:1.1;margin:0}
h2{font-size:19px;font-weight:500;letter-spacing:-.01em;margin:0}
h3{font-size:16px;font-weight:500;margin:0}
.muted{color:var(--muted)}.ms{color:var(--muted-strong)}.small{font-size:12.5px}.mono{font-family:var(--mono);font-size:12.5px}
.push{margin-left:auto}

.shell{max-width:1440px;margin:0 auto;padding:18px 28px 64px}
.topbar{display:flex;align-items:center;gap:24px;padding:4px 0 8px}
.brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:600;letter-spacing:-.02em}
.brand-mark{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 200deg,#fff 0 25%,var(--violet-2) 25% 60%,var(--violet) 60% 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.nav{display:flex;gap:8px;margin:0 auto}
.nav-pill{padding:10px 22px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--muted-strong);white-space:nowrap}
.nav-pill:hover{color:var(--text);background:var(--surface-3)}
.nav-pill.active{background:#fff;color:#000}
.topbar-right{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-pill);background:var(--surface-2);font-size:13px;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--lime)}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--violet-2);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(163,135,255,.6)}70%,100%{box-shadow:0 0 0 8px rgba(163,135,255,0)}}
.live-ind{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface-2)}
.live-ind i{width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px rgba(212,242,106,.6)}
.page{padding-top:48px;display:flex;flex-direction:column;gap:22px}

.btn-white{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 22px;border-radius:var(--r-pill);background:#fff;color:#000;border:none;font-size:15px;font-weight:500}
.btn-white:hover{background:#e9e9ec}
.btn-white.sm{height:36px;padding:0 16px;font-size:13.5px}
.ghost{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:var(--r-pill);background:var(--surface-2);border:none;font-size:13px}
.ghost:hover{background:var(--surface-3)}
.ghost.red{background:rgba(255,107,107,.14);color:#ffb3b3}
.ghost.red:hover{background:rgba(255,107,107,.22)}
.pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:var(--r-pill);background:var(--surface-3);font-size:12.5px;white-space:nowrap;color:var(--muted-strong)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:#5d5d62}
.t-lime .dot{background:var(--lime)}.t-violet .dot{background:var(--violet-2)}.t-amber .dot{background:var(--amber)}.t-red .dot{background:var(--red)}.t-red{color:#ffb3b3}
.card{background:var(--surface);border-radius:var(--r-card);padding:24px}
.section-head{display:flex;align-items:baseline;gap:12px;margin:14px 0 0}

/* ── A: needs you ── */
.needs{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.need{display:grid;grid-template-columns:auto 1fr auto;gap:6px 16px;align-items:center;padding:20px 22px}
.need .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;grid-row:span 2;font-weight:700}
.need.warn .ic{background:rgba(245,184,74,.14);color:var(--amber)}
.need.bad{background:rgba(255,107,107,.07)}
.need.bad .ic{background:rgba(255,107,107,.16);color:var(--red)}
.need h3{font-size:17px}
.need p{margin:0;grid-column:2;color:var(--muted-strong);font-size:13.5px}
.need .act{grid-row:1/3;grid-column:3}

/* ── current: project cards, + A: stage line and task ticks ── */
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.project-card{display:flex;flex-direction:column;gap:18px;transition:background .15s,transform .15s}
.project-card:hover{background:#161616;transform:translateY(-2px)}
.project-card.working{box-shadow:inset 0 0 0 1px rgba(122,77,255,.45)}
.pc-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pc-main{display:flex;align-items:flex-end;gap:18px}
.pc-pct{font-size:52px;font-weight:600;letter-spacing:-.045em;line-height:.9}
.pc-pct span{color:#6b6b70;font-size:30px}
.pc-meta{font-size:13.5px;line-height:1.45}
.stops{position:relative;display:grid;grid-template-columns:repeat(7,1fr);align-items:center;height:22px}
.stops .rail{position:absolute;left:calc(100%/14);right:calc(100%/14);top:50%;height:3px;margin-top:-1.5px;border-radius:3px;background:#2a2a2e}
.stops .rail b{position:absolute;inset:0 auto 0 0;border-radius:3px;background:linear-gradient(90deg,var(--lime),#8aa63f)}
.stop{justify-self:center;position:relative;z-index:1;width:12px;height:12px;border-radius:50%;background:var(--surface-3)}
.stop.done{background:var(--lime)}
.stop.cur{width:18px;height:18px;background:var(--violet);box-shadow:0 0 0 5px rgba(122,77,255,.18)}
.stop.cur.warn{background:var(--amber);box-shadow:0 0 0 5px rgba(245,184,74,.16)}
.stop.cur.bad{background:var(--red);box-shadow:0 0 0 5px rgba(255,107,107,.16)}
.stop.cur.run{animation:pulse 1.8s infinite}
.stop-labels{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;text-align:center;margin-top:6px;height:16px}
.stop-labels span{white-space:nowrap;overflow:visible;display:flex;justify-content:center}
.stop-labels .on{color:var(--text);font-weight:500}
.ticks{display:flex;gap:3px}
.ticks i{flex:1;height:8px;border-radius:3px;background:var(--surface-3);max-width:28px}
.ticks i.done{background:var(--lime)}.ticks i.run{background:var(--violet)}.ticks i.warn{background:var(--amber)}
.pc-blocked{margin:0;font-size:13px;color:#ffb3b3;background:rgba(255,107,107,.08);border-radius:14px;padding:10px 12px}
.pc-foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* this week (current hero stats, demoted) */
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stat-label{color:var(--muted-strong);font-size:15px}
.stat-big{font-size:56px;font-weight:600;letter-spacing:-.045em;line-height:1;margin:14px 0 14px;display:flex;align-items:baseline;gap:2px}
.stat-big .f{color:#6b6b70}
.stat-delta{font-size:14px;font-weight:500;letter-spacing:0;margin-left:12px;color:var(--lime)}
.mini-bars{display:flex;align-items:flex-end;gap:10px;height:130px}
.mini-bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.mini-bars i{width:100%;max-width:34px;border-radius:8px;background:var(--violet)}
.mini-bars i.hi{background:var(--lime)}
.mini-bars span{font-size:11.5px;color:var(--muted-strong)}
.activity{list-style:none;margin:0;padding:0}
.activity li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0}
.activity li+li{border-top:1px solid #1d1d1f}
.activity .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── project page ── */
.project-header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.ph-main{display:flex;flex-direction:column;gap:10px;max-width:760px}
.ph-main .lede{color:var(--muted-strong);font-size:16px;margin:0}
.ph-side{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ph-pct{font-size:34px;font-weight:600;letter-spacing:-.04em;text-align:right;line-height:1.1}
.ph-pct span{color:#6b6b70;font-size:20px}
.toolbar{display:flex;align-items:center;gap:4px;padding:5px;background:var(--surface-2);border-radius:var(--r-pill)}
.tool-btn{height:34px;border-radius:var(--r-pill);border:none;background:transparent;font-size:13px;padding:0 14px}
.tool-btn:hover{background:var(--surface-3)}
.tool-btn.w{background:#fff;color:#000}
.track-card{padding:22px 12px 18px;overflow-x:auto}
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(130px,1fr))}
.track-step{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:0 10px}
.track-step+.track-step::before{content:"";position:absolute;top:20px;right:calc(50% + 26px);left:calc(-50% + 26px);height:2px;border-radius:2px;background:#2a2a2e}
.track-step.after-done::before{background:linear-gradient(90deg,var(--lime),#8aa63f)}
.track-node{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;background:var(--surface-3);color:var(--muted-strong);position:relative;z-index:1}
.s-done .track-node{background:var(--lime);color:#111}
.s-active .track-node{background:var(--violet);color:#fff;box-shadow:0 0 0 6px rgba(122,77,255,.18)}
.track-title{font-size:14px;font-weight:500;margin-top:6px}
.track-meta{font-size:12px;color:var(--muted)}

.lane{padding:26px 28px 22px}
.lane.pending{background:transparent;box-shadow:inset 0 0 0 1px #1f1f22}
.lane-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}
.kicker{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.lane-head h2{font-size:24px;letter-spacing:-.02em}
.lane-meta{display:flex;align-items:center;gap:14px}
.count{font-size:30px;font-weight:600;letter-spacing:-.03em}
.graph{position:relative;display:flex;gap:72px;align-items:center;overflow-x:auto;padding:6px 2px 10px}
.graph>svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
.edge{fill:none;stroke:#3a3a40;stroke-width:1.6;stroke-dasharray:4 5}
.edge.done{stroke:rgba(212,242,106,.55);stroke-dasharray:none}
.edge.run{stroke:rgba(163,135,255,.75);stroke-dasharray:none}
.col{display:flex;flex-direction:column;gap:14px;flex:0 0 250px;position:relative;z-index:1}
.col>.node{flex-shrink:0}
.node{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;padding:14px 16px;border-radius:18px;background:var(--surface-2);border:1px solid #262629;transition:border-color .15s,transform .15s}
.node:hover{border-color:#3a3a40;transform:translateY(-1px)}
.node.sel{border-color:#fff}
.node-top{display:flex;align-items:center;gap:8px}
.node .dot{width:8px;height:8px;border-radius:50%;flex:none;background:#5d5d62}
.node.t-lime{background:#161616}.node.t-lime .dot{background:var(--lime)}.node.t-lime .node-title{color:var(--muted-strong)}
.node.live{border-color:rgba(122,77,255,.7);box-shadow:0 0 0 4px rgba(122,77,255,.12)}
.node.live .dot{background:var(--violet-2);animation:pulse 1.8s infinite}
.node.t-amber{border-color:rgba(245,184,74,.35)}.node.t-amber .dot{background:var(--amber)}
.node-key{font-family:var(--mono);font-size:12px;color:var(--violet-2)}
.node-status{margin-left:auto;font-size:11.5px;color:var(--muted-strong)}
.node-check{margin-left:auto;color:var(--lime)}
.node-title{font-size:14px;font-weight:500;line-height:1.35}
.node-meta{display:flex;gap:10px;font-size:12px;color:var(--muted)}
.node-attempts{color:var(--amber)}
.merge{display:flex;align-items:center;gap:12px;margin:-8px 0 -8px 46px;color:var(--muted);font-size:12.5px}
.merge::before{content:"";width:2px;height:28px;border-radius:2px;background:#2a2a2e}
.merge.done::before{background:var(--lime)}

.drawer-wrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}
.drawer{position:absolute;top:12px;right:12px;bottom:12px;width:min(560px,calc(100vw - 24px));overflow-y:auto;background:#101010;border:1px solid #222;border-radius:26px;padding:22px 26px 30px;animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.drawer-title{font-size:24px;letter-spacing:-.02em;margin:14px 0 18px;line-height:1.25}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.stats>div{background:var(--surface-2);border-radius:16px;padding:10px 12px;font-size:13.5px}
.stats .muted{font-size:11.5px;display:block}
.fix{background:rgba(245,184,74,.09);border-radius:18px;padding:16px 18px;margin-bottom:18px}
.fix strong{color:var(--amber);font-weight:500;display:block;margin-bottom:6px}
.check-line{display:flex;align-items:center;gap:10px;font-size:14px;padding:6px 0}
.check-dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.ok .check-dot{background:var(--lime);color:#111}.bad .check-dot{background:var(--red);color:#111}
pre{background:#0a0a0a;border-radius:14px;padding:12px 14px;font:12px/1.6 var(--mono);white-space:pre-wrap;color:#ffb3b3;margin:6px 0 0}

/* wizard (current) */
.wizard{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.wz-rail{display:flex;flex-direction:column;gap:10px}
.wz-mode{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--surface);border:1px solid transparent;text-align:left;width:100%}
.wz-mode:hover{background:#161616}
.wz-mode.on{border-color:var(--violet)}
.wz-mode .mi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:600}
.wz-mode span:last-child{display:flex;flex-direction:column;line-height:1.3}
.wz-steps{list-style:none;margin:8px 0 0;padding:0 4px;display:flex;flex-direction:column;gap:2px}
.wz-steps button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;color:var(--muted);padding:8px 6px;font-size:14px;border-radius:12px;text-align:left}
.wz-steps li.done button{color:var(--muted-strong)}
.wz-steps li.cur button{color:var(--text)}
.wz-num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--surface-2);flex:none}
.wz-steps li.cur .wz-num{background:#fff;color:#000}
.wz-steps li.done .wz-num{background:var(--lime);color:#111}
.wz-card{padding:34px 38px 26px;min-height:520px;display:flex;flex-direction:column}
.wz-title{font-size:clamp(28px,3.4vw,40px);margin-top:8px}
.wz-hint{color:var(--muted-strong);margin:10px 0 0;font-size:15px;max-width:680px}
.wz-body{display:flex;flex-direction:column;gap:14px;margin:28px 0 24px;flex:1;max-width:820px}
.wz-foot{display:flex;justify-content:space-between;align-items:center;padding-top:18px;border-top:1px solid #1d1d1f}
input,textarea{font:inherit;color:var(--text);background:var(--surface-2);border:1px solid transparent;border-radius:14px;padding:11px 14px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--violet);background:#161616}
textarea{min-height:110px;font-size:15px}
.inspect{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:18px;background:#0d0d0d}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:7px;border-radius:14px;background:var(--surface-2)}
.chip-tag{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:var(--r-pill);background:var(--surface-3);font-size:13px;border:none}
.chip-tag.on{background:var(--violet);color:#fff}
.seg{display:inline-flex;gap:4px;padding:5px;border-radius:var(--r-pill);background:var(--surface-2)}
.seg button{border:none;background:none;color:var(--muted-strong);height:40px;padding:0 20px;border-radius:var(--r-pill)}
.seg button.on{background:var(--surface-3);color:var(--text)}
.review{margin:0;border-radius:18px;overflow:hidden;background:#0d0d0d}
.review div{display:grid;grid-template-columns:200px 1fr;gap:16px;padding:12px 18px}
.review div+div{border-top:1px solid #1a1a1c}
.review dt{color:var(--muted);font-size:13px}.review dd{margin:0}
[hidden]{display:none!important}
@media (max-width:1180px){.grid-3{grid-template-columns:1fr 1fr}.grid-3>:last-child{grid-column:1/-1}}
@media (max-width:960px){.wizard{grid-template-columns:1fr}}
@media (max-width:860px){.topbar{flex-wrap:wrap}.nav{order:3;width:100%;margin:0;overflow-x:auto}.topbar-right{margin-left:auto}.chip.job{display:none}}
@media (max-width:720px){.shell{padding:14px 16px 48px}.page{padding-top:28px}.grid-3{grid-template-columns:1fr}.needs{grid-template-columns:1fr}.need{grid-template-columns:auto 1fr}.need .act{grid-row:auto;grid-column:2;justify-self:start}
  .graph{flex-direction:column;align-items:stretch;gap:14px}.col{flex-basis:auto}.graph>svg{display:none}.stats{grid-template-columns:1fr 1fr}.card{padding:18px;border-radius:22px}.stop-labels{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="#overview"><span class="brand-mark" aria-hidden="true"></span><span>AI PM</span></a>
    <nav class="nav" aria-label="Main">
      <a class="nav-pill" data-v="overview" href="#overview">Overview</a>
      <a class="nav-pill" data-v="project" href="#project">Links</a>
      <a class="nav-pill" data-v="wizard" href="#wizard">New project</a>
    </nav>
    <div class="topbar-right">
      <a class="chip job" href="#project"><i class="pulse-dot"></i>links<span class="mono muted">4m 12s</span></a>
      <span class="chip"><i class="dot"></i>62% quota</span>
      <span class="live-ind" title="Live updates connected"><i></i></span>
    </div>
  </header>
  <main class="page" id="overview" hidden></main>
  <main class="page" id="project" hidden></main>
  <main class="page" id="wizard" hidden></main>
</div>
<div id="drawer"></div>

<script src="data.js"></script>
<script>
const D = window.AIPM, L = D.statusLabel, $ = s => document.querySelector(s);
const tone = s => ({done:"lime",running:"violet",executing:"violet",architecting:"violet",active:"violet",rework:"amber",awaiting_owner:"amber",blocked:"red"}[s] || "neutral");
const pill = (s, text) => `<span class="pill t-${tone(s)}"><i class="dot"></i>${text || L[s]}</span>`;
const date = d => d ? new Date(d+"T00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : null;
const check = `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-6.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;

/* ───────── overview ───────── */
function overview(){
  const P = D.projects, needs = P.filter(p => p.attention);
  const cards = P.map(p => {
    const pct = p.total ? Math.round(p.done / p.total * 100) : (p.status === "done" ? 100 : 0);
    const at = p.status === "done" ? 7 : p.flowAt;
    const cur = { executing:"run", architecting:"run", awaiting_owner:"warn", blocked:"bad" }[p.status] || "";
    const stops = D.flowSteps.map((s, i) => `<span class="stop ${i < at ? "done" : i === at ? "cur " + cur : ""}" title="${s}"></span>`).join("");
    const ticks = p.total ? Array.from({length: p.total}, (_, i) => `<i class="${i < p.done ? "done" : p.slug === "links" && i === p.done ? "run" : p.slug === "links" && i === p.done + 1 ? "warn" : ""}"></i>`).join("") : "";
    const phase = p.slug === "links" ? "Phase 2/3 · Short links API" : p.status === "awaiting_owner" ? "Plan ready · 3 phases" : p.status === "blocked" ? "Phase 2/2 · New post pages" : p.status === "architecting" ? "Architect is writing the design" : "Finished";
    return `<a class="card project-card ${p.slug === "links" ? "working" : ""}" href="${p.slug === "links" ? "#project" : "#overview"}">
      <div class="pc-head"><h3>${p.name}</h3>${pill(p.status, p.slug === "links" ? "Running" : L[p.status])}</div>
      <div class="pc-main"><div class="pc-pct">${pct}<span>%</span></div>
        <div class="pc-meta"><div>${p.total ? `${p.done} of ${p.total} tasks` : "No plan yet"}</div><div class="muted">${phase}</div></div></div>
      <div><div class="stops"><span class="rail"><b style="width:${Math.min(at, 6) / 6 * 100}%"></b></span>${stops}</div>
        <div class="stop-labels">${D.flowSteps.map((s, i) => `<span class="${i === at ? "on" : ""}">${i === at ? s : ""}</span>`).join("")}</div></div>
      ${ticks ? `<div class="ticks" aria-label="${p.done} of ${p.total} tasks done">${ticks}</div>` : ""}
      ${p.status === "blocked" ? `<p class="pc-blocked">Needs your input: ${p.attention}</p>` : ""}
      <div class="pc-foot"><span class="pill">P${p.priority}</span><span class="pill">${p.profile}</span>${date(p.deadline) ? `<span class="pill">Due ${date(p.deadline)}</span>` : ""}
        <span class="muted push small">${p.usage7d.tokens}M tok</span></div>
    </a>`;
  }).join("");
  const days = P[0].usage7d.days.map((_, i) => P.reduce((a, p) => a + p.usage7d.days[i], 0)), mx = Math.max(...days);
  $("#overview").innerHTML = `
    <h1>Good afternoon, <span class="ms">two projects need you.</span></h1>
    <section class="needs">${needs.map(p => `
      <div class="card need ${p.status === "blocked" ? "bad" : "warn"}"><span class="ic">${p.status === "blocked" ? "!" : "?"}</span>
        <h3>${p.name}</h3><p>${p.attention}</p>
        <span class="act">${p.status === "blocked" ? `<button class="ghost red">Answer</button>` : `<button class="btn-white sm">Review plan</button>`}</span></div>`).join("")}
    </section>
    <section>
      <div class="section-head"><h2>Projects</h2><span class="muted">${P.length} total · Links is running</span><span class="push"></span><a class="btn-white sm" href="#wizard">New project +</a></div>
      <div class="project-grid" style="margin-top:14px">${cards}</div>
    </section>
    <section>
      <div class="section-head" style="margin-bottom:14px"><h2>This week</h2><a class="muted push small" href="#overview">Open usage ↘</a></div>
      <div class="grid-3">
        <div class="card"><div class="stat-label">Tokens used</div><div class="stat-big">4.2<span class="f">M</span><span class="stat-delta">−8.0%</span></div>
          <div class="ms">Tasks done: <strong style="color:var(--text)">14</strong>  ·  Quota: <strong style="color:var(--text)">62%</strong> <span class="muted">(resets ${D.limit.resetAt})</span></div></div>
        <div class="card"><h2 style="margin-bottom:16px">Throughput</h2><div class="mini-bars">${days.map((v, i) => `<div><i class="${v === mx ? "hi" : ""}" style="height:${v / mx * 100}px" title="${v.toFixed(1)}"></i><span>${["Tue","Wed","Thu","Fri","Sat","Sun","Mon"][i]}</span></div>`).join("")}</div></div>
        <div class="card"><h2 style="margin-bottom:8px">Recent activity</h2><ul class="activity">${D.events.slice(0, 5).map(e => `<li><span class="muted mono">${e.at}</span><span class="tt">${e.text}</span>${pill({run:"running",rework:"rework",approve:"done",owner:"awaiting_owner",blocked:"blocked"}[e.kind], e.project)}</li>`).join("")}</ul></div>
      </div>
    </section>`;
}

/* ───────── project ───────── */
let sel = null;
function project(){
  const P = D.project, pct = Math.round(P.done / P.total * 100);
  const flow = P.flow.map((f, i) => `<li class="track-step ${f.status === "done" ? "s-done" : "s-active"} ${i && P.flow[i-1].status === "done" ? "after-done" : ""}">
      <span class="track-node">${f.status === "done" ? check : i + 1}</span><span class="track-title">${f.label}</span><span class="track-meta">${f.meta}</span></li>`).join("");
  const lanes = P.phases.map((ph, pi) => {
    const keys = new Set(ph.tasks.map(t => t.key)), depth = {}, cols = [];
    ph.tasks.forEach(t => { const d = t.deps.filter(k => keys.has(k)); depth[t.key] = d.length ? 1 + Math.max(...d.map(k => depth[k])) : 0; (cols[depth[t.key]] ||= []).push(t); });
    const done = ph.tasks.filter(t => t.status === "done").length;
    const node = t => {
      const cls = t.status === "done" ? "t-lime" : t.status === "running" ? "live" : t.status === "rework" ? "t-amber" : "";
      return `<button class="node ${cls} ${t.key === sel ? "sel" : ""}" data-k="${t.key}">
        <span class="node-top"><i class="dot"></i><span class="node-key">${t.key}</span>${t.status === "done" ? `<span class="node-check">${check}</span>` : `<span class="node-status">${L[t.status]}</span>`}</span>
        <span class="node-title">${t.title}</span>
        <span class="node-meta"><span>${t.model} · ${t.effort}</span>${t.attempts > 1 ? `<span class="node-attempts">try ${t.attempts}/${t.max}</span>` : ""}${t.startedMin ? `<span>${t.startedMin}m</span>` : ""}</span></button>`;
    };
    const merge = pi ? `<div class="merge ${P.phases[pi-1].status === "done" ? "done" : ""}">${P.phases[pi-1].status === "done" ? "Merged into main" : "Merges into main after review"}</div>` : "";
    return `${merge}<section class="card lane ${ph.status}">
      <div class="lane-head"><div><div class="kicker">Phase ${ph.idx} of ${P.phases.length}</div><h2>${ph.title}</h2></div>
        <div class="lane-meta">${pill(ph.status, ph.status === "active" ? "In progress" : L[ph.status])}<span class="count">${done}<span class="muted">/${ph.tasks.length}</span></span></div></div>
      <div class="graph" data-lane><svg></svg>${cols.map(c => `<div class="col">${c.map(node).join("")}</div>`).join("")}</div>
    </section>`;
  }).join("");
  $("#project").innerHTML = `
    <div class="project-header">
      <div class="ph-main"><div style="display:flex;gap:14px;align-items:center"><h1>Links</h1>${pill("executing", "Running")}</div>
        <p class="lede">Building phase 2 of 3. One task is being reworked after two failing tests. Due ${date(P.deadline)}.</p></div>
      <div class="ph-side"><div class="ph-pct">${pct}<span>%</span><div class="muted small" style="font-size:12.5px;font-weight:400;letter-spacing:0">${P.done} of ${P.total} tasks</div></div>
        <div class="toolbar"><button class="tool-btn">Priority 4</button><button class="tool-btn">Balanced</button><button class="tool-btn">Edit plan</button><button class="tool-btn w">Pause</button></div></div>
    </div>
    <div class="card track-card"><ol class="track">${flow}</ol></div>
    ${lanes}`;
  $("#project").querySelectorAll("[data-k]").forEach(b => b.onclick = () => { sel = b.dataset.k; project(); drawer(); });
  requestAnimationFrame(edges);
}
function edges(){
  const all = D.project.phases.flatMap(p => p.tasks);
  document.querySelectorAll("[data-lane]").forEach(g => {
    const svg = g.querySelector("svg"), box = g.getBoundingClientRect(); let d = "";
    g.querySelectorAll(".node").forEach(n => {
      const t = all.find(x => x.key === n.dataset.k);
      t.deps.forEach(k => { const s = g.querySelector(`[data-k="${k}"]`); if (!s) return;
        const a = s.getBoundingClientRect(), b = n.getBoundingClientRect();
        const x1 = a.right - box.left + g.scrollLeft, y1 = a.top + a.height/2 - box.top, x2 = b.left - box.left + g.scrollLeft, y2 = b.top + b.height/2 - box.top, m = (x1+x2)/2;
        d += `<path class="edge ${t.status === "pending" ? "" : t.status === "running" ? "run" : "done"}" d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}"/>`; });
    });
    svg.setAttribute("width", g.scrollWidth); svg.setAttribute("height", g.scrollHeight); svg.innerHTML = d;
  });
}
function drawer(){
  if (!sel) { $("#drawer").innerHTML = ""; return; }
  const P = D.project, t = P.phases.flatMap(p => p.tasks).find(x => x.key === sel), v = P.verifications[t.key] || [];
  $("#drawer").innerHTML = `<div class="drawer-wrap" id="dw"><aside class="drawer" aria-label="Task details">
    <div style="display:flex;gap:12px;align-items:center"><span class="node-key" style="font-size:13px">${t.key}</span>${pill(t.status)}<button class="ghost push" id="close">Close</button></div>
    <div class="drawer-title">${t.title}</div>
    <div class="stats"><div><span class="muted">Attempts</span>${t.attempts}/${t.max}</div><div><span class="muted">Model</span>${t.model}</div><div><span class="muted">Effort</span>${t.effort}</div><div><span class="muted">Needs</span>${t.deps.join(", ") || "—"}</div></div>
    ${t.feedback ? `<div class="fix"><strong>What to fix</strong>${t.feedback}</div>` : ""}
    ${v.length ? `<h3 style="margin-bottom:6px">Checks</h3>${v.map(c => `<div class="check-line ${c.exit ? "bad" : "ok"}"><span class="check-dot">${c.exit ? "✕" : "✓"}</span><span class="mono">${c.cmd}</span><span class="muted push small">${(c.ms/1000).toFixed(1)}s</span></div>${c.tail ? `<pre>${c.tail}</pre>` : ""}`).join("")}` : ""}
    <div style="display:flex;gap:8px;margin-top:22px">${t.status === "running" ? `<button class="btn-white sm">Open live log</button>` : `<button class="btn-white sm">Retry now</button><button class="ghost">Skip</button>`}<button class="ghost">Edit task</button></div>
  </aside></div>`;
  $("#dw").onclick = e => { if (e.target.id === "dw") { sel = null; drawer(); project(); } };
  $("#close").onclick = () => { sel = null; drawer(); project(); };
}

/* ───────── wizard (current layout) ───────── */
let mode = "scratch", step = 0;
function wizard(){
  const M = D.modes[mode], steps = [...M.steps, "Review"], name = steps[step], h = D.stepHelp[name];
  const icons = { scratch: ["+", "var(--violet)", "#fff"], existing: ["↻", "var(--lime)", "#111"], rework: ["✦", "#fff", "#111"] };
  let body = "";
  if (!h) body = `<dl class="review">${M.steps.map(s => `<div><dt>${s}</dt><dd>${D.stepHelp[s].value || (D.stepHelp[s].items || []).slice(0, 2).join(", ") || "Balanced, priority 3"}</dd></div>`).join("")}</dl>`;
  else {
    if (h.kind === "text") body = `<input value="${h.value}">`;
    if (h.kind === "area") body = `<textarea>${h.value}</textarea>`;
    if (h.kind === "repo") body = `<input class="mono" value="${h.value}"><div class="inspect">${D.repoCheck.map(c => `<div class="check-line ok"><span class="check-dot">✓</span>${c.text}</div>`).join("")}</div>`;
    if (h.kind === "chips" || h.kind === "list") body = `<div class="chips">${h.items.map((c, i) => `<button class="chip-tag ${i < 2 ? "on" : ""}" onclick="this.classList.toggle('on')">${c}</button>`).join("")}</div>`;
    if (h.kind === "toggle") body = `<div class="seg"><button class="on">Keep behaviour</button><button>May change</button></div>`;
    if (h.kind === "profile") body = `<div class="seg">${["Quality","Balanced","Speed","Cost"].map(x => `<button class="${x === "Balanced" ? "on" : ""}">${x}</button>`).join("")}</div><input type="date" style="max-width:220px">`;
  }
  $("#wizard").innerHTML = `<div class="wizard">
    <div class="wz-rail">${Object.entries(D.modes).map(([k, m]) => `<button class="wz-mode ${k === mode ? "on" : ""}" data-m="${k}"><span class="mi" style="background:${icons[k][1]};color:${icons[k][2]}">${icons[k][0]}</span><span><b style="font-weight:500">${m.label}</b><span class="muted small">First: ${m.first}</span></span></button>`).join("")}
      <ol class="wz-steps">${steps.map((s, i) => `<li class="${i < step ? "done" : i === step ? "cur" : ""}"><button data-s="${i}"><span class="wz-num">${i < step ? "✓" : i + 1}</span>${s}</button></li>`).join("")}</ol></div>
    <div class="card wz-card"><div class="muted">Step ${step + 1} of ${steps.length}</div>
      <h1 class="wz-title">${h ? h.q : "Ready to start"}</h1><p class="wz-hint">${h ? h.hint : `The ${M.first.toLowerCase()} runs first. You approve the plan before anything is built.`}</p>
      <div class="wz-body">${body}</div>
      <div class="wz-foot">${step ? `<button class="ghost" data-go="-1">Back</button>` : "<span></span>"}<button class="btn-white" data-go="1">${h ? "Continue" : "Create and start"}</button></div></div></div>`;
  $("#wizard").querySelectorAll("[data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; step = 0; wizard(); });
  $("#wizard").querySelectorAll("[data-s]").forEach(b => b.onclick = () => { step = +b.dataset.s; wizard(); });
  $("#wizard").querySelectorAll("[data-go]").forEach(b => b.onclick = () => { step = Math.max(0, Math.min(steps.length - 1, step + +b.dataset.go)); wizard(); });
}

function route(){
  const v = (location.hash || "#overview").slice(1);
  ["overview","project","wizard"].forEach(id => $("#" + id).hidden = id !== v);
  document.querySelectorAll(".nav-pill").forEach(a => a.classList.toggle("active", a.dataset.v === v));
  sel = null; drawer();
  ({overview, project, wizard})[v]();
}
addEventListener("hashchange", route);
addEventListener("resize", () => !$("#project").hidden && edges());
route();
</script>
</body>
</html>
